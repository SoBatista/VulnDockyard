[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vulndockyard"
dynamic = ["version"]
description = "A provenance-aware local runner for intentionally vulnerable security labs."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "VulnDockyard maintainers"}]
keywords = ["security", "training", "docker", "owasp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "coverage[toml]==7.10.6",
  "hatchling==1.27.0",
  "mypy==1.17.1",
  "pre-commit==4.3.0",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.12",
  "types-PyYAML==6.0.12.20250822",
]

[project.scripts]
vulndockyard = "vulndockyard.cli:main"
vdy = "vulndockyard.cli:main"

[tool.hatch.version]
path = "src/vulndockyard/_version.py"

[project.urls]
Homepage = "https://github.com/SoBatista/VulnDockyard"
Issues = "https://github.com/SoBatista/VulnDockyard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vulndockyard"]
artifacts = ["src/vulndockyard/data/**/*.json"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/docs",
  "/.github",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/DCO.md",
  "/GOVERNANCE.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/VERSION",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=vulndockyard --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = [
  "docker: requires an accessible Docker daemon",
  "smoke: pulls and runs reviewed lab images",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
