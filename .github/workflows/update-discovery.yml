name: Update discovery

on:
  schedule:
    - cron: "41 5 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-discovery
  cancel-in-progress: false

jobs:
  report:
    name: candidate-report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: ""
      - name: Install controller from the reviewed dependency closure
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Generate read-only candidate report
        run: python scripts/update_report.py artifacts/update-candidates.json
      - name: Upload short-lived report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-candidates-${{ github.run_id }}
          path: artifacts/update-candidates.json
          retention-days: 7
          if-no-files-found: error
