name: Update discovery

on:
  schedule:
    - cron: "41 5 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-discovery
  cancel-in-progress: false

jobs:
  report:
    name: candidate-report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: ""
      - name: Install controller without development extras
        run: python -m pip install --disable-pip-version-check .
      - name: Generate read-only candidate report
        run: python scripts/update_report.py artifacts/update-candidates.json
      - name: Upload short-lived report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-candidates-${{ github.run_id }}
          path: artifacts/update-candidates.json
          retention-days: 7
          if-no-files-found: error
