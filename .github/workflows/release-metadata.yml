name: Release metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: exact-release-impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full reviewed history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: ""
      - name: Read current labels and validate exact increment
        env:
          GH_TOKEN: ${{ github.token }}
          VDY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VDY_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/check_release_metadata.py
      - name: Validate every pull-request commit DCO sign-off
        env:
          VDY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_dco.py
