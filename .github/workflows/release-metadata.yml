name: Release metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: exact-release-impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full reviewed history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: ""
      - name: Read current labels and validate exact increment
        env:
          GH_TOKEN: ${{ github.token }}
          VDY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VDY_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/check_release_metadata.py
