name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version reviewed on main
        required: true
        type: string
      ci_run_id:
        description: Successful main CI run ID for the exact commit
        required: true
        type: string
      confirm:
        description: Type publish-vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-reviewed-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out main with full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: ""
      - name: Install exact release tooling
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Verify authorization, main CI, version, and release shape
        env:
          GH_TOKEN: ${{ github.token }}
          VDY_CI_RUN_ID: ${{ inputs.ci_run_id }}
          VDY_CONFIRM: ${{ inputs.confirm }}
          VDY_RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release.py prepare
      - name: Attest wheel provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: artifacts/release/*.whl
      - name: Publish immutable tag and idempotent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VDY_CI_RUN_ID: ${{ inputs.ci_run_id }}
          VDY_CONFIRM: ${{ inputs.confirm }}
          VDY_RELEASE_VERSION: ${{ inputs.version }}
          VDY_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: python scripts/release.py publish
