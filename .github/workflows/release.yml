name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version reviewed on main
        required: true
        type: string
      ci_run_id:
        description: Successful main CI run ID for the exact commit
        required: true
        type: string
      confirm:
        description: Type publish-vX.Y.Z
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: build-reviewed-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: ""
      - name: Install the hash-locked build closure
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Verify authorization, main CI, version, and release shape
        env:
          GH_TOKEN: ${{ github.token }}
          VDY_CI_RUN_ID: ${{ inputs.ci_run_id }}
          VDY_CONFIRM: ${{ inputs.confirm }}
          VDY_RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release.py prepare
      - name: Transfer the verified release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish-reviewed-release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Download the isolated build payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: artifacts/release
      - name: Attest release payload provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release/*
      - name: Publish immutable tag and idempotent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VDY_CI_RUN_ID: ${{ inputs.ci_run_id }}
          VDY_CONFIRM: ${{ inputs.confirm }}
          VDY_RELEASE_VERSION: ${{ inputs.version }}
          VDY_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: python3 scripts/release.py publish
