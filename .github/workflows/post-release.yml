name: Post-release verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: post-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify-published-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out verification code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: ""
      - name: Download and verify genuine published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VDY_RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release.py verify-published
