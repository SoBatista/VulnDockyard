name: CI

on:
  push:
    branches:
      - main
      - "bootstrap/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-python-3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: ""
      - name: Install exact development dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Run deterministic controller gates
        run: scripts/ci-check.sh

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  docker-smoke:
    name: runnable-adapter-smoke
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: ""
      - name: Install exact development dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Run all reviewed adapter smoke tests
        env:
          VDY_RUN_DOCKER_TESTS: "1"
        run: python -m pytest -m 'docker and smoke' --no-cov
      - name: Audit residual resources
        if: always()
        run: scripts/docker-audit.sh
