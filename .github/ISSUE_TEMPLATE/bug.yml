name: Controller bug
description: Report reproducible unintended VulnDockyard behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, exploit flags, or unsafe public target details.
  - type: input
    id: version
    attributes:
      label: VulnDockyard version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include exact local commands with sensitive values removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Suspected classification
      options:
        - VulnDockyard adapter defect
        - Upstream packaging defect
        - Upstream runtime defect
        - Expected intentional vulnerability
        - Obsolete-dependency compatibility problem
        - Missing or untrusted image
        - Architecture-specific failure
    validations:
      required: true
